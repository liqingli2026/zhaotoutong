<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>招投通</title>
    <script type="module" crossorigin src="./assets/index-Cfu2G3xm.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DX-7LP7Z.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <img class="brand-logo" src="./banner.png" alt="中帆德新能源" />
        <div class="topbar-text">
          <h1 class="topbar-title">招投通</h1>
          <div class="topbar-sub" id="statLine">加载中…</div>
        </div>
        <button id="shortlistBtn" class="shortlist-btn" type="button">
          <span class="sl-btn-icon">★</span>可投标 <span id="shortlistCount" class="sl-badge">0</span>
        </button>
        <button id="noBidBtn" class="nobid-btn" type="button" aria-pressed="false">
          <span class="sl-btn-icon">✕</span>不可投 <span id="noBidCount" class="sl-badge nobadge">0</span>
        </button>
        <button id="grabHelperBtn" class="grabhelper-btn" type="button" title="抓取禁复制的招标网页">
          <span class="sl-btn-icon">📋</span>抓取助手
        </button>
      </header>

      <section class="filters">
        <div class="filter-scroll">
          <div class="filter-row" id="catFilter">
            <button class="chip chip-active" data-cat="all">全部</button>
          </div>
        </div>

        <div class="filter-scroll">
          <div class="filter-row" id="bizFilter"></div>
        </div>

        <div class="filter-scroll">
          <div class="filter-row" id="groupFilter"></div>
        </div>

        <div class="filter-scroll">
          <div class="filter-row" id="soeFilter"></div>
        </div>

        <div class="search-row">
          <input id="searchInput" type="search" placeholder="搜索标题 / 来源 / 关键词" />
        </div>
      </section>

      <main id="list" class="list"></main>

      <div id="loadMore" class="load-more">加载更多</div>
      <div id="loading" class="loading">正在连接云数据库…</div>
      <div id="empty" class="empty hidden">暂无相关招标信息</div>

      <footer class="foot">
        <span id="connState">未连接</span>
        <a id="debugToggle" href="?debug=1">调试</a>
      </footer>

      <div id="shortlistOverlay" class="sl-overlay"></div>
      <aside id="shortlistPanel" class="sl-panel" aria-hidden="true">
        <div class="sl-head">
          <span class="sl-head-title">可投标清单</span>
          <button id="shortlistClose" class="sl-close" type="button" aria-label="关闭">×</button>
        </div>
        <div id="shortlistItems" class="sl-items"></div>
      </aside>

      <div id="shareOverlay" class="share-overlay"></div>
      <div id="shareSheet" class="share-sheet" aria-hidden="true">
        <div class="share-head">
          <span class="share-head-title">分享给同事</span>
          <button id="shareClose" class="share-close" type="button" aria-label="关闭">×</button>
        </div>
        <div id="shareBody" class="share-body"></div>
      </div>

      <div id="toast" class="toast" aria-live="polite"></div>

      <div id="grabHelperOverlay" class="grab-overlay"></div>
      <div id="grabHelperModal" class="grab-modal" aria-hidden="true">
        <div class="grab-head">
          <span class="grab-head-title">抓取助手</span>
          <button id="grabHelperClose" class="grab-close" type="button" aria-label="关闭">×</button>
        </div>
        <div class="grab-body">
          <p class="grab-tip">遇到<strong>禁复制</strong>的招标页（北地、安徽交易、中铁鲁班等），把下面按钮拖到书签栏。以后在那种页面点一下书签，即可解锁复制并提取标题/网址/时间，一键复制到微信去查。</p>
          <a id="grabBookmarklet" class="grab-drag" href="#">📋 抓取招标信息（拖我到书签栏）</a>
          <ol class="grab-steps">
            <li>把上面橙色按钮<strong>拖到书签栏</strong>（地址栏下方）。看不到书签栏按 <code>Ctrl+Shift+B</code>。</li>
            <li>拖不动？按钮上<strong>右键→复制链接地址</strong>，再书签栏空白处<strong>右键→添加网页</strong>粘贴进去。</li>
            <li>以后在禁复制的招标页点一下该书签即可。</li>
          </ol>
          <p class="grab-note">此工具仅在你的浏览器本地运行，不收集、不上传任何数据。</p>
        </div>
      </div>
    </div>
  </body>
</html>
